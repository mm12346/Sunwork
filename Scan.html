<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แอปจัดการและสแกน PDF</title>
    
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด jsPDF (สำหรับสร้าง PDF จากรูปสแกน) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- โหลด Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- pdf-lib สำหรับ แก้ไข/รวม/แยก/ลบ/จัดเรียง หน้า PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <!-- pdf.js สำหรับแปลงหน้า PDF เป็นรูปภาพ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- SortableJS สำหรับระบบลากวาง (Drag & Drop) จัดเรียงหน้า -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        body {
            overflow: hidden; /* ล็อกไม่ให้หน้าจอเลื่อนหลุดกรอบ */
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* ปรับให้พอดีกับหน้าจอมือถือแบบไดนามิก */
            overscroll-behavior-y: none; /* ป้องกันการดึงเพื่อรีเฟรช (Pull-to-refresh) */
            background-color: #f3f4f6;
        }
        .dark-mode {
            background-color: #111827;
            color: white;
        }
        .shutter-animation { animation: shutter 0.2s ease-out; }
        @keyframes shutter {
            0% { opacity: 1; background-color: white; }
            100% { opacity: 0; background-color: transparent; }
        }
        .hidden-file-input { display: none; }
        
        .pdf-page-thumbnail {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .pdf-page-thumbnail.selected-remove {
            border: 3px solid #ef4444; 
            opacity: 0.6;
            filter: grayscale(100%);
        }
        .pdf-page-thumbnail.selected-extract {
            border: 3px solid #22c55e; 
            transform: scale(0.95);
        }
        .filter-btn {
            border: 1px solid transparent;
        }
        .filter-btn.active {
            border-color: #f97316;
            color: #f97316;
            background-color: rgba(249, 115, 22, 0.1);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f97316;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col font-sans transition-colors duration-300 w-full">

    <header class="bg-white dark:bg-gray-800 p-4 shadow-sm flex justify-between items-center z-30 relative transition-colors duration-300 border-b border-gray-200 dark:border-gray-700 flex-shrink-0 w-full">
        <div class="flex items-center gap-3">
            <button id="back-btn" class="hidden p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 active:scale-95 transition-transform">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <h1 id="app-title" class="text-xl font-bold flex items-center gap-2 text-gray-800 dark:text-white">
                <i data-lucide="layers" class="text-orange-500 w-6 h-6"></i> PDF Tools
            </h1>
        </div>
        
        <div class="flex items-center gap-2">
            <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300">
                <i data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 relative overflow-y-auto overflow-x-hidden w-full">
        
        <div id="view-home" class="p-4 max-w-lg mx-auto w-full h-full flex flex-col py-6">
            <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-4 px-2 uppercase tracking-wide">เครื่องมือจัดการ PDF</h2>
            <div class="grid grid-cols-2 gap-4">
                
                <button onclick="openTool('merge')" class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center gap-3 hover:shadow-md active:scale-[0.98] transition-all">
                    <div class="bg-orange-500/10 p-4 rounded-2xl text-orange-500"><i data-lucide="combine" class="w-8 h-8"></i></div>
                    <span class="font-medium text-gray-800 dark:text-gray-200">รวม PDF</span>
                </button>

                <button onclick="openTool('split')" class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center gap-3 hover:shadow-md active:scale-[0.98] transition-all">
                    <div class="bg-orange-500/10 p-4 rounded-2xl text-orange-500"><i data-lucide="split-square-horizontal" class="w-8 h-8"></i></div>
                    <span class="font-medium text-gray-800 dark:text-gray-200">แยก PDF</span>
                </button>

                <button onclick="openTool('remove')" class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center gap-3 hover:shadow-md active:scale-[0.98] transition-all">
                    <div class="bg-red-500/10 p-4 rounded-2xl text-red-500"><i data-lucide="x-square" class="w-8 h-8"></i></div>
                    <span class="font-medium text-gray-800 dark:text-gray-200">ลบหน้าออก</span>
                </button>

                <button onclick="openTool('extract')" class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center gap-3 hover:shadow-md active:scale-[0.98] transition-all">
                    <div class="bg-blue-500/10 p-4 rounded-2xl text-blue-500"><i data-lucide="share" class="w-8 h-8"></i></div>
                    <span class="font-medium text-gray-800 dark:text-gray-200">แยกหน้า</span>
                </button>

                <button onclick="openTool('organize')" class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center gap-3 hover:shadow-md active:scale-[0.98] transition-all">
                    <div class="bg-orange-500/10 p-4 rounded-2xl text-orange-500 flex flex-col items-center">
                        <div class="flex gap-1"><span class="text-[10px] bg-orange-200 text-orange-800 px-1 rounded font-bold">A</span></div>
                        <div class="flex gap-1 mt-1"><span class="text-[10px] bg-orange-500 text-white px-1 rounded font-bold">B</span></div>
                    </div>
                    <span class="font-medium text-gray-800 dark:text-gray-200">จัดระเบียบ PDF</span>
                </button>

                <button onclick="openTool('scan')" class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col items-center gap-3 hover:shadow-md active:scale-[0.98] transition-all relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-br from-orange-500/5 to-transparent"></div>
                    <div class="bg-orange-500 text-white p-4 rounded-2xl shadow-lg relative z-10"><i data-lucide="camera" class="w-8 h-8"></i></div>
                    <span class="font-medium text-gray-800 dark:text-gray-200 relative z-10">สแกนเป็น PDF</span>
                </button>
            </div>
        </div>

        <div id="view-scanner" class="hidden h-full flex-col bg-black relative">
            
            <!-- CAMERA UI MODE -->
            <div id="scanner-camera-mode" class="flex-1 relative flex flex-col">
                <div class="flex-1 relative flex justify-center items-center overflow-hidden">
                    <video id="camera-feed" class="w-full h-full object-cover transition-opacity duration-300" autoplay playsinline></video>
                    <div id="flash-effect" class="absolute inset-0 pointer-events-none opacity-0 z-20 bg-white"></div>
                    
                    <div id="camera-error" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-gray-900 text-center p-6 z-10">
                        <i data-lucide="camera-off" class="w-16 h-16 text-red-400 mb-4"></i>
                        <p class="text-white mb-2">ไม่สามารถเปิดกล้องได้</p>
                    </div>
                </div>

                <div class="bg-gray-900 p-4 sm:p-6 shadow-xl pb-8 z-30 flex-shrink-0 w-full">
                    <input type="file" id="scan-upload" accept="image/*" multiple class="hidden-file-input">
                    
                    <div class="flex justify-between items-center max-w-md mx-auto w-full px-2">
                        <label for="scan-upload" class="flex flex-col items-center p-2 text-gray-400 hover:text-white cursor-pointer w-16">
                            <i data-lucide="image" class="w-6 h-6 mb-1"></i>
                        </label>
                        
                        <button id="capture-btn" class="relative group outline-none focus:outline-none mx-4">
                            <div class="w-20 h-20 border-4 border-white rounded-full flex items-center justify-center">
                                <div class="w-16 h-16 bg-white rounded-full group-active:bg-gray-300 transition-colors duration-150"></div>
                            </div>
                        </button>
                        
                        <div class="flex flex-col items-center w-16">
                            <div id="batch-preview-container" class="relative w-12 h-12 rounded border-2 border-gray-600 bg-gray-800 hidden cursor-pointer shadow-lg active:scale-95 transition-transform" onclick="openScanPreview()">
                                <img id="batch-preview-img" class="w-full h-full object-cover opacity-80" src="">
                                <div id="batch-count-badge" class="absolute -top-2 -right-2 bg-orange-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow">1</div>
                                <div class="absolute inset-0 flex items-center justify-center text-white/80"><i data-lucide="arrow-right" class="w-6 h-6 drop-shadow-md"></i></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="scanner-edit-mode" class="hidden flex-1 relative flex flex-col bg-gray-900 w-full">
                <div class="flex justify-between items-center p-4 z-40 bg-gray-900/80 backdrop-blur flex-shrink-0 w-full">
                    <button id="scan-retake-btn" class="text-white active:scale-95 p-2"><i data-lucide="x" class="w-6 h-6"></i></button>
                    <div class="flex gap-2 sm:gap-4">
                        <button id="scan-rotate-btn" class="text-white active:scale-95 p-2 bg-gray-800 rounded-lg"><i data-lucide="rotate-cw" class="w-6 h-6"></i></button>
                        <button id="scan-filter-toggle-btn" class="text-orange-500 active:scale-95 p-2 bg-gray-800 rounded-lg"><i data-lucide="wand-2" class="w-6 h-6"></i></button>
                        <button id="scan-crop-toggle-btn" class="text-gray-400 active:scale-95 p-2 bg-gray-800 rounded-lg flex items-center gap-1"><i data-lucide="crop" class="w-6 h-6"></i><span class="text-xs font-bold hidden sm:block">ครอบตัด</span></button>
                    </div>
                </div>

                <div class="flex-1 relative flex justify-center items-center overflow-hidden w-full" id="scan-workspace">
                    <canvas id="captured-canvas" class="shadow-2xl max-w-full max-h-full"></canvas>
                    
                    <!-- Perspective Crop Overlay (SVG & Points) -->
                    <div id="crop-overlay" class="hidden touch-none absolute z-10">
                        <svg id="crop-svg" class="absolute inset-0 w-full h-full">
                            <defs>
                                <mask id="crop-mask">
                                    <rect width="100%" height="100%" fill="white" />
                                    <polygon id="crop-polygon-mask" points="" fill="black" />
                                </mask>
                            </defs>
                            <rect width="100%" height="100%" fill="rgba(0,0,0,0.7)" mask="url(#crop-mask)" pointer-events="none" />
                            <polygon id="crop-polygon-hitbox" points="" fill="transparent" class="cursor-move" pointer-events="all" />
                            <polygon id="crop-polygon-border" points="" fill="none" stroke="#f97316" stroke-width="2" pointer-events="none" stroke-linejoin="round"/>
                        </svg>
                        
                        <div id="handle-tl" class="absolute w-8 h-8 -ml-4 -mt-4 bg-orange-500 rounded-full border-2 border-white shadow crop-handle cursor-nwse-resize flex items-center justify-center z-20 pointer-events-auto" data-handle="tl"><div class="w-2 h-2 bg-white rounded-full pointer-events-none"></div></div>
                        <div id="handle-tr" class="absolute w-8 h-8 -ml-4 -mt-4 bg-orange-500 rounded-full border-2 border-white shadow crop-handle cursor-nesw-resize flex items-center justify-center z-20 pointer-events-auto" data-handle="tr"><div class="w-2 h-2 bg-white rounded-full pointer-events-none"></div></div>
                        <div id="handle-br" class="absolute w-8 h-8 -ml-4 -mt-4 bg-orange-500 rounded-full border-2 border-white shadow crop-handle cursor-nwse-resize flex items-center justify-center z-20 pointer-events-auto" data-handle="br"><div class="w-2 h-2 bg-white rounded-full pointer-events-none"></div></div>
                        <div id="handle-bl" class="absolute w-8 h-8 -ml-4 -mt-4 bg-orange-500 rounded-full border-2 border-white shadow crop-handle cursor-nesw-resize flex items-center justify-center z-20 pointer-events-auto" data-handle="bl"><div class="w-2 h-2 bg-white rounded-full pointer-events-none"></div></div>
                    </div>
                </div>

                <div class="p-4 pb-6 bg-gray-900 shadow-[0_-10px_20px_rgba(0,0,0,0.2)] z-40 flex flex-col gap-3 flex-shrink-0 w-full">
                    
                    <!-- Filters Bar -->
                    <div id="scan-filter-bar" class="flex space-x-3 overflow-x-auto hide-scrollbar pb-2">
                        <button class="filter-btn flex flex-col items-center justify-center min-w-[70px] p-2 rounded-lg text-gray-400 hover:text-white transition" data-filter="original">
                            <div class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center mb-1 border border-gray-600">
                                <i data-lucide="image" class="w-4 h-4 text-gray-400"></i>
                            </div>
                            <span class="text-xs">ต้นฉบับ</span>
                        </button>
                        <button class="filter-btn active flex flex-col items-center justify-center min-w-[70px] p-2 rounded-lg text-gray-400 hover:text-white transition" data-filter="magic">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-yellow-300 to-orange-500 mb-1"></div>
                            <span class="text-xs">สีคมชัด</span>
                        </button>
                        <button class="filter-btn flex flex-col items-center justify-center min-w-[70px] p-2 rounded-lg text-gray-400 hover:text-white transition" data-filter="grayscale">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-gray-300 to-gray-600 mb-1"></div>
                            <span class="text-xs">สีเทา</span>
                        </button>
                        <button class="filter-btn flex flex-col items-center justify-center min-w-[70px] p-2 rounded-lg text-gray-400 hover:text-white transition" data-filter="bw">
                            <div class="w-8 h-8 rounded-full bg-black border border-white mb-1"></div>
                            <span class="text-xs">ขาวดำ</span>
                        </button>
                    </div>

                    <button id="scan-keep-btn" class="w-full max-w-md mx-auto py-4 bg-orange-500 text-white rounded-xl font-bold shadow-lg shadow-orange-500/30 active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i> เพิ่มหน้านี้เข้าเอกสาร
                    </button>
                </div>
            </div>
            
            <div id="view-scan-preview" class="hidden absolute inset-0 z-50 flex-col bg-gray-50 dark:bg-gray-900 overflow-hidden">
                <div class="bg-white dark:bg-gray-800 p-4 shadow-sm flex items-center justify-between border-b border-gray-200 dark:border-gray-700">
                    <div class="flex items-center gap-3">
                        <button id="close-preview-btn" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        </button>
                        <h2 class="text-lg font-bold text-gray-800 dark:text-white">พรีวิวเอกสาร (<span id="preview-page-count">0</span> หน้า)</h2>
                    </div>
                </div>
                
                <div class="flex-1 overflow-y-auto p-4">
                    <div id="scan-preview-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4 max-w-2xl mx-auto pb-24">
                        <!-- Thumbnails injected here -->
                    </div>
                </div>

                <div class="p-4 pb-6 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] absolute bottom-0 left-0 right-0 w-full z-10">
                    <button id="open-export-sheet-btn" class="w-full max-w-md mx-auto block py-4 bg-orange-500 text-white rounded-xl font-bold shadow-lg shadow-orange-500/30 active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
                        <i data-lucide="file-check-2" class="w-5 h-5"></i> ไปที่หน้าบันทึก PDF
                    </button>
                </div>
            </div>

            <div id="scan-export-modal" class="hidden absolute inset-0 bg-black/80 backdrop-blur-sm z-[60] flex-col items-center justify-end">
                <div class="bg-white dark:bg-gray-900 w-full rounded-t-3xl p-6 shadow-2xl pb-10 transform translate-y-full transition-transform duration-300" id="scan-export-sheet">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold text-gray-800 dark:text-white flex items-center gap-2">
                            <i data-lucide="save" class="text-orange-500"></i> บันทึก PDF
                        </h3>
                        <button id="close-export-btn" class="p-2 text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full"><i data-lucide="x"></i></button>
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">ขนาดกระดาษ</label>
                        <select id="paper-size-select" class="w-full bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 outline-none focus:border-orange-500">
                            <option value="a4">A4 (มาตรฐาน)</option>
                            <option value="letter">Letter</option>
                            <option value="legal">Legal</option>
                        </select>
                    </div>

                    <button id="scan-save-final-btn" class="w-full py-4 bg-orange-500 text-white rounded-xl font-bold shadow-lg shadow-orange-500/30 active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
                        <i data-lucide="download" class="w-5 h-5"></i> <span id="export-btn-text">ดาวน์โหลด PDF</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="view-merge" class="hidden flex-col h-full bg-white dark:bg-gray-900 p-4">
            <div class="flex-1 overflow-y-auto w-full max-w-lg mx-auto">
                <div class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-2xl p-8 text-center bg-gray-50 dark:bg-gray-800/50 mb-6 relative">
                    <input type="file" id="merge-file-input" accept="application/pdf" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="text-orange-500 mb-3 flex justify-center"><i data-lucide="file-plus-2" class="w-12 h-12"></i></div>
                    <p class="font-medium text-gray-700 dark:text-gray-300">แตะเพื่อเลือกไฟล์ PDF</p>
                    <p class="text-sm text-gray-500 mt-1">สามารถเลือกได้หลายไฟล์พร้อมกัน</p>
                </div>

                <div class="mb-2 flex justify-between items-center text-sm">
                    <span class="font-semibold text-gray-700 dark:text-gray-300">ไฟล์ที่เลือก:</span>
                    <span id="merge-count" class="text-orange-500 font-bold">0 ไฟล์</span>
                </div>
                
                <ul id="merge-file-list" class="space-y-2 pb-28"></ul>
            </div>
            
            <div class="absolute bottom-0 left-0 right-0 p-4 pb-6 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] w-full z-10">
                <button id="action-merge-btn" class="w-full max-w-lg mx-auto block py-3 bg-orange-500 text-white rounded-xl font-bold shadow-lg shadow-orange-500/30 active:scale-[0.98] transition-transform disabled:opacity-50 disabled:active:scale-100 flex items-center justify-center gap-2">
                    <i data-lucide="combine" class="w-5 h-5"></i> รวมและบันทึก PDF
                </button>
            </div>
        </div>

        <div id="view-editor" class="hidden flex-col h-full bg-white dark:bg-gray-900">
            <div id="editor-upload-section" class="flex-1 flex items-center justify-center p-4">
                <div class="w-full max-w-lg relative border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-2xl p-10 text-center bg-gray-50 dark:bg-gray-800/50">
                    <input type="file" id="editor-file-input" accept="application/pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div id="editor-upload-icon" class="text-orange-500 mb-4 flex justify-center"><i data-lucide="upload-cloud" class="w-16 h-16"></i></div>
                    <h3 id="editor-upload-title" class="text-lg font-bold text-gray-700 dark:text-gray-200 mb-2">เลือกไฟล์ PDF</h3>
                    <p id="editor-upload-desc" class="text-sm text-gray-500">เพื่อเริ่มจัดการหน้ากระดาษ</p>
                </div>
            </div>

            <div id="editor-workspace" class="hidden flex-col h-full relative">
                <div class="bg-gray-100 dark:bg-gray-800 p-3 text-sm text-center text-gray-600 dark:text-gray-300 border-b border-gray-200 dark:border-gray-700 font-medium flex items-center justify-center gap-2" id="editor-instruction">
                    <i data-lucide="info" class="w-4 h-4"></i> <span>...</span>
                </div>
                
                <div class="flex-1 overflow-y-auto p-4 pb-28 bg-gray-50 dark:bg-gray-900 w-full">
                    <div id="pdf-thumbnails-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4 max-w-2xl mx-auto"></div>
                </div>

                <div class="absolute bottom-0 left-0 right-0 p-4 pb-6 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 shadow-lg w-full z-10">
                    <button id="editor-action-btn" class="w-full max-w-lg mx-auto block py-3 bg-orange-500 text-white rounded-xl font-bold shadow-lg shadow-orange-500/30 active:scale-[0.98] transition-transform flex items-center justify-center gap-2 disabled:opacity-50 disabled:bg-gray-400">
                        <i data-lucide="save" class="w-5 h-5"></i> <span id="editor-btn-text">ดำเนินการ</span>
                    </button>

        const video = document.getElementById('camera-feed');

        let scanBatch = [];

        let cropPoints = [
            { x: 0.1, y: 0.1 }, { x: 0.9, y: 0.1 }, { x: 0.9, y: 0.9 }, { x: 0.1, y: 0.9 }
        ];

        function solveLinearSystem(A, B) {
            const n = B.length;
            for (let i = 0; i < n; i++) {
                let maxEl = Math.abs(A[i][i]), maxRow = i;
                for (let k = i + 1; k < n; k++) {
                    if (Math.abs(A[k][i]) > maxEl) { maxEl = Math.abs(A[k][i]); maxRow = k; }
                }
                for (let k = i; k < n; k++) {
                    const tmp = A[maxRow][k]; A[maxRow][k] = A[i][k]; A[i][k] = tmp;
                }
                const tmpB = B[maxRow]; B[maxRow] = B[i]; B[i] = tmpB;
                
                if (Math.abs(A[i][i]) < 1e-10) continue;
                
                for (let k = i + 1; k < n; k++) {
                    const c = -A[k][i] / A[i][i];
                    for (let j = i; j < n; j++) {
                        if (i === j) A[k][j] = 0; else A[k][j] += c * A[i][j];
                    }
                    B[k] += c * B[i];
                }
            }
            const x = new Array(n).fill(0);
            for (let i = n - 1; i >= 0; i--) {
                if (Math.abs(A[i][i]) < 1e-10) x[i] = 0;
                else {
                    x[i] = B[i] / A[i][i];
                    for (let k = i - 1; k >= 0; k--) { B[k] -= A[k][i] * x[i]; }
                }
            }
            return x;
        }

        function getPerspectiveTransform(src, dst) {
            const A = [], B = [];
            for (let i = 0; i < 4; i++) {
                A.push([dst[i].x, dst[i].y, 1, 0, 0, 0, -src[i].x * dst[i].x, -src[i].x * dst[i].y]);
                A.push([0, 0, 0, dst[i].x, dst[i].y, 1, -src[i].y * dst[i].x, -src[i].y * dst[i].y]);
                B.push(src[i].x);
                B.push(src[i].y);
            }
            const h = solveLinearSystem(A, B);
            h.push(1);
            return h;
        }

        function applyPerspectiveWarp(srcCanvas, srcPoints, dstWidth, dstHeight) {
            const dstCanvas = document.createElement('canvas');
            dstCanvas.width = dstWidth; dstCanvas.height = dstHeight;
            const ctxDst = dstCanvas.getContext('2d');
            const ctxSrc = srcCanvas.getContext('2d');
            
            const srcData = ctxSrc.getImageData(0, 0, srcCanvas.width, srcCanvas.height);
            const dstData = ctxDst.createImageData(dstWidth, dstHeight);
            
            const dstPoints = [{x:0, y:0}, {x:dstWidth, y:0}, {x:dstWidth, y:dstHeight}, {x:0, y:dstHeight}];
            const H = getPerspectiveTransform(srcPoints, dstPoints);
            
            const sData = srcData.data, dData = dstData.data;
            const sw = srcCanvas.width, sh = srcCanvas.height;
            
            let i = 0;
            for (let y = 0; y < dstHeight; y++) {
                for (let x = 0; x < dstWidth; x++) {
                    const z = H[6] * x + H[7] * y + 1;
                    const sx = (H[0] * x + H[1] * y + H[2]) / z;
                    const sy = (H[3] * x + H[4] * y + H[5]) / z;
                    
                    const x1 = sx | 0, y1 = sy | 0; 
                    
                    if (x1 >= 0 && x1 < sw - 1 && y1 >= 0 && y1 < sh - 1) {
                        const wx = sx - x1, wy = sy - y1;
                        const w1 = (1 - wx) * (1 - wy), w2 = wx * (1 - wy);
                        const w3 = (1 - wx) * wy, w4 = wx * wy;
                        
                        const idx1 = (y1 * sw + x1) * 4;
                        const idx2 = idx1 + 4, idx3 = ((y1 + 1) * sw + x1) * 4, idx4 = idx3 + 4;
                        
                        dData[i]   = sData[idx1]*w1 + sData[idx2]*w2 + sData[idx3]*w3 + sData[idx4]*w4;
                        dData[i+1] = sData[idx1+1]*w1 + sData[idx2+1]*w2 + sData[idx3+1]*w3 + sData[idx4+1]*w4;
                        dData[i+2] = sData[idx1+2]*w1 + sData[idx2+2]*w2 + sData[idx3+2]*w3 + sData[idx4+2]*w4;
                        dData[i+3] = 255;
                    }
                    i += 4;
                }
            }
            ctxDst.putImageData(dstData, 0, 0);
            return dstCanvas;
        }

        async function initScanner() {
            document.getElementById('camera-error').classList.add('hidden');
            scannerCameraMode.classList.remove('hidden'); scannerCameraMode.classList.add('flex');
            scannerEditMode.classList.add('hidden'); scannerEditMode.classList.remove('flex');
            scanExportModal.classList.add('hidden'); scanExportModal.classList.remove('flex');
            scanPreviewView.classList.add('hidden'); scanPreviewView.classList.remove('flex');
            
            if (cameraStream) return;
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
                });
                video.srcObject = cameraStream;
            } catch (err) {
                document.getElementById('camera-error').classList.remove('hidden');
            }
        }

        function stopCamera() {
            if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); cameraStream = null; }
        }

        function updateBatchUI() {
            if (scanBatch.length > 0) {
                batchPreviewContainer.classList.remove('hidden');
                batchCountBadge.textContent = scanBatch.length;
                batchPreviewImg.src = scanBatch[scanBatch.length - 1];
            } else {
                batchPreviewContainer.classList.add('hidden');
            }
        }

        captureBtn.addEventListener('click', () => {
            if (!cameraStream) return;
            const flash = document.getElementById('flash-effect');
            flash.classList.remove('shutter-animation'); void flash.offsetWidth; flash.classList.add('shutter-animation');
            
            const tmpC = document.createElement('canvas'); 
            tmpC.width = video.videoWidth; tmpC.height = video.videoHeight;
            tmpC.getContext('2d').drawImage(video, 0, 0);
            
            enterScanEditMode(tmpC.toDataURL('image/jpeg', 1.0));
        });

        document.getElementById('scan-upload').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            
            uploadQueue = [];
            let loadedCount = 0;
            files.forEach(file => {
                const r = new FileReader();
                r.onload = (ev) => {
                    uploadQueue.push(ev.target.result);
                    loadedCount++;
                    if (loadedCount === files.length) processNextInQueue();
                };
                r.readAsDataURL(file);
            });
            e.target.value = '';
        });

        function processNextInQueue() {
            if (uploadQueue.length > 0) enterScanEditMode(uploadQueue.shift());
            else initScanner();
        }

        function enterScanEditMode(src) {
            stopCamera();
            scanRotation = 0; 
            scanCurrentFilter = 'magic'; 
            isCropMode = false;
            cropPoints = [{x:0.1, y:0.1}, {x:0.9, y:0.1}, {x:0.9, y:0.9}, {x:0.1, y:0.9}];
            
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.filter-btn[data-filter="magic"]').classList.add('active');
            
            isFilterBarVisible = true;
            document.getElementById('scan-filter-bar').classList.remove('hidden');
            document.getElementById('scan-filter-toggle-btn').classList.replace('text-gray-400', 'text-orange-500');
            
            updateCropBtnUI();
            
            scannerCameraMode.classList.add('hidden'); scannerCameraMode.classList.remove('flex');
            scannerEditMode.classList.remove('hidden'); scannerEditMode.classList.add('flex');

            showLoading('กำลังเตรียมรูปภาพ...');
            scanOriginalImage.onload = () => { hideLoading(); renderScanCanvas(); };
            scanOriginalImage.src = src;
        }

        function renderScanCanvas() {
            if (!scanOriginalImage.src) return;
            const isLandscape = scanRotation === 90 || scanRotation === 270;
            let originalW = isLandscape ? scanOriginalImage.height : scanOriginalImage.width;
            let originalH = isLandscape ? scanOriginalImage.width : scanOriginalImage.height;
            
            const MAX_DIMENSION = 2000;
            if (originalW > MAX_DIMENSION || originalH > MAX_DIMENSION) {
                const ratio = Math.min(MAX_DIMENSION / originalW, MAX_DIMENSION / originalH);
                originalW = Math.round(originalW * ratio);
                originalH = Math.round(originalH * ratio);
            }
            
            scanCanvas.width = originalW; scanCanvas.height = originalH;
            scanCtx.clearRect(0, 0, scanCanvas.width, scanCanvas.height);
            scanCtx.save();
            scanCtx.translate(scanCanvas.width / 2, scanCanvas.height / 2);
            scanCtx.rotate((scanRotation * Math.PI) / 180);
            
            let drawWidth = isLandscape ? scanCanvas.height : scanCanvas.width;
            let drawHeight = isLandscape ? scanCanvas.width : scanCanvas.height;
            
            scanCtx.drawImage(scanOriginalImage, -drawWidth/2, -drawHeight/2, drawWidth, drawHeight);
            scanCtx.restore();

            if (scanCurrentFilter !== 'original') {
                applyCanvasFilter(scanCurrentFilter);
            }

            positionCropOverlay(originalW, originalH);
        }

        function applyCanvasFilter(filterType) {
            const imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
            const data = imageData.data;
            const length = data.length;

            for (let i = 0; i < length; i += 4) {
                let r = data[i], g = data[i + 1], b = data[i + 2];
                const luminance = 0.299 * r + 0.587 * g + 0.114 * b;

                if (filterType === 'grayscale') {
                    data[i] = data[i + 1] = data[i + 2] = luminance;
                } 
                else if (filterType === 'bw') {
                    const threshold = 120;
                    const value = luminance > threshold ? 255 : 0;
                    data[i] = data[i + 1] = data[i + 2] = value;
                } 
                else if (filterType === 'magic') {
                    let contrast = 1.5, brightness = 20;
                    let newR = (r - 128) * contrast + 128 + brightness;
                    let newG = (g - 128) * contrast + 128 + brightness;
                    let newB = (b - 128) * contrast + 128 + brightness;

                    data[i] = Math.max(0, Math.min(255, newR));
                    data[i + 1] = Math.max(0, Math.min(255, newG));
                    data[i + 2] = Math.max(0, Math.min(255, newB));
                }
            }
            scanCtx.putImageData(imageData, 0, 0);
        }

        function positionCropOverlay(imgW, imgH) {
            const wsW = scanWorkspace.clientWidth, wsH = scanWorkspace.clientHeight;
            const imgAspect = imgW / imgH, wsAspect = wsW / wsH;
            let drawW, drawH;
            
            if (imgAspect > wsAspect) { drawW = wsW; drawH = wsW / imgAspect; } 
            else { drawH = wsH; drawW = wsH * imgAspect; }
            
            scanCanvas.style.width = drawW + 'px'; scanCanvas.style.height = drawH + 'px'; scanCanvas.style.position = 'absolute';
            cropOverlay.style.width = drawW + 'px'; cropOverlay.style.height = drawH + 'px'; cropOverlay.style.position = 'absolute';
            updateCropBoxDOM();
        }

        function updateCropBoxDOM() {
            const ow = cropOverlay.clientWidth, oh = cropOverlay.clientHeight;
            
            document.getElementById('handle-tl').style.left = (cropPoints[0].x * 100) + '%';
            document.getElementById('handle-tl').style.top = (cropPoints[0].y * 100) + '%';
            document.getElementById('handle-tr').style.left = (cropPoints[1].x * 100) + '%';
            document.getElementById('handle-tr').style.top = (cropPoints[1].y * 100) + '%';
            document.getElementById('handle-br').style.left = (cropPoints[2].x * 100) + '%';
            document.getElementById('handle-br').style.top = (cropPoints[2].y * 100) + '%';
            document.getElementById('handle-bl').style.left = (cropPoints[3].x * 100) + '%';
            document.getElementById('handle-bl').style.top = (cropPoints[3].y * 100) + '%';
            
            const ptsString = cropPoints.map(p => `${p.x * ow},${p.y * oh}`).join(' ');
            document.getElementById('crop-polygon-mask').setAttribute('points', ptsString);
            document.getElementById('crop-polygon-hitbox').setAttribute('points', ptsString);
            document.getElementById('crop-polygon-border').setAttribute('points', ptsString);
        }

        let activeCropHandle = null, cropStartPos = null, cropStartPoints = null;

        function startCropDrag(e, handle, clientX, clientY) {
            e.preventDefault();
            activeCropHandle = handle;
            cropStartPos = { x: clientX, y: clientY };
            cropStartPoints = JSON.parse(JSON.stringify(cropPoints));
        }

        function moveCropDrag(clientX, clientY) {
            if(!activeCropHandle) return;
            const rect = cropOverlay.getBoundingClientRect();
            
            if (activeCropHandle === 'move') {
                const dx = (clientX - cropStartPos.x) / rect.width, dy = (clientY - cropStartPos.y) / rect.height;
                let canMove = true;
                for(let i=0; i<4; i++) {
                    const nx = cropStartPoints[i].x + dx, ny = cropStartPoints[i].y + dy;
                    if(nx < 0 || nx > 1 || ny < 0 || ny > 1) canMove = false;
                }
                if (canMove) {
                    for(let i=0; i<4; i++) {
                        cropPoints[i].x = cropStartPoints[i].x + dx; cropPoints[i].y = cropStartPoints[i].y + dy;
                    }
                }
            } else {
                let x = (clientX - rect.left) / rect.width, y = (clientY - rect.top) / rect.height;
                x = Math.max(0, Math.min(1, x)); y = Math.max(0, Math.min(1, y));
                
                if (activeCropHandle === 'tl') cropPoints[0] = {x, y};
                else if (activeCropHandle === 'tr') cropPoints[1] = {x, y};
                else if (activeCropHandle === 'br') cropPoints[2] = {x, y};
                else if (activeCropHandle === 'bl') cropPoints[3] = {x, y};
            }
            updateCropBoxDOM();
        }

        cropOverlay.addEventListener('mousedown', (e) => {
            if(e.target.closest('.crop-handle')) { startCropDrag(e, e.target.closest('.crop-handle').dataset.handle, e.clientX, e.clientY); } 
            else if (e.target.id === 'crop-polygon-hitbox') { startCropDrag(e, 'move', e.clientX, e.clientY); }
        });
        window.addEventListener('mousemove', (e) => moveCropDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', () => { activeCropHandle = null; });
        
        cropOverlay.addEventListener('touchstart', (e) => {
            if(e.target.closest('.crop-handle')) { startCropDrag(e, e.target.closest('.crop-handle').dataset.handle, e.touches[0].clientX, e.touches[0].clientY); } 
            else if (e.target.id === 'crop-polygon-hitbox') { startCropDrag(e, 'move', e.touches[0].clientX, e.touches[0].clientY); }
        }, {passive: false});
        window.addEventListener('touchmove', (e) => {
            if(activeCropHandle) { e.preventDefault(); moveCropDrag(e.touches[0].clientX, e.touches[0].clientY); }
        }, {passive: false});
        window.addEventListener('touchend', () => { activeCropHandle = null; });

        document.getElementById('scan-retake-btn').addEventListener('click', () => {
            if (uploadQueue.length > 0) processNextInQueue();
            else initScanner();
        });

        document.getElementById('scan-rotate-btn').addEventListener('click', () => { 
            showLoading('กำลังหมุนภาพ...');
            setTimeout(() => {
                scanRotation = (scanRotation + 90) % 360; 
                cropPoints = [{x:0.1, y:0.1}, {x:0.9, y:0.1}, {x:0.9, y:0.9}, {x:0.1, y:0.9}];
                renderScanCanvas(); 
                hideLoading();
            }, 10);
        });

        const scanFilterToggleBtn = document.getElementById('scan-filter-toggle-btn');
        const scanFilterBar = document.getElementById('scan-filter-bar');
        const filterBtns = document.querySelectorAll('.filter-btn');

        scanFilterToggleBtn.addEventListener('click', () => {
            isFilterBarVisible = !isFilterBarVisible;
            if(isFilterBarVisible) {
                scanFilterBar.classList.remove('hidden');
                scanFilterToggleBtn.classList.replace('text-gray-400', 'text-orange-500');
            } else {
                scanFilterBar.classList.add('hidden');
                scanFilterToggleBtn.classList.replace('text-orange-500', 'text-gray-400');
            }
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                scanCurrentFilter = btn.dataset.filter;
                showLoading('กำลังปรับแต่งสี...');
                setTimeout(() => {
                    renderScanCanvas();
                    hideLoading();
                }, 10);
            });
        });

        const cropBtn = document.getElementById('scan-crop-toggle-btn');
        cropBtn.addEventListener('click', () => {
            isCropMode = !isCropMode; updateCropBtnUI();
        });
        function updateCropBtnUI() {
            if (isCropMode) {
                cropBtn.classList.replace('text-gray-400', 'text-orange-500'); cropOverlay.classList.remove('hidden');
            } else {
                cropBtn.classList.replace('text-orange-500', 'text-gray-400'); cropOverlay.classList.add('hidden');
            }
        }

        document.getElementById('scan-keep-btn').addEventListener('click', () => {
            showLoading('กำลังจัดมุมภาพและจัดเก็บ...');
            
            setTimeout(() => {
                let finalDataUrl;
                
                if (isCropMode) {
                    const sw = scanCanvas.width, sh = scanCanvas.height;
                    const pts = cropPoints.map(p => ({ x: p.x * sw, y: p.y * sh }));
                    
                    const w1 = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    const w2 = Math.hypot(pts[3].x - pts[2].x, pts[3].y - pts[2].y);
                    const dstW = Math.max(w1, w2);
                    
                    const h1 = Math.hypot(pts[0].x - pts[3].x, pts[0].y - pts[3].y);
                    const h2 = Math.hypot(pts[1].x - pts[2].x, pts[1].y - pts[2].y);
                    const dstH = Math.max(h1, h2);
                    
                    const warpedCanvas = applyPerspectiveWarp(scanCanvas, pts, Math.round(dstW), Math.round(dstH));
                    finalDataUrl = warpedCanvas.toDataURL('image/jpeg', 0.85);
                } else {
                    finalDataUrl = scanCanvas.toDataURL('image/jpeg', 0.85);
                }

                scanBatch.push(finalDataUrl);
                updateBatchUI(); hideLoading();
                
                if (uploadQueue.length > 0) processNextInQueue(); else initScanner();
            }, 100);
        });

        window.openScanPreview = () => {
            if (scanBatch.length === 0) return;
            scannerCameraMode.classList.add('hidden');
            scannerCameraMode.classList.remove('flex');
            scanPreviewView.classList.remove('hidden'); 
            scanPreviewView.classList.add('flex');
            renderScanPreview();
        };

        document.getElementById('close-preview-btn').addEventListener('click', () => {
            scanPreviewView.classList.add('hidden');
            scanPreviewView.classList.remove('flex');
            initScanner();
        });

        function renderScanPreview() {
            const grid = document.getElementById('scan-preview-grid');
            grid.innerHTML = '';
            document.getElementById('preview-page-count').textContent = scanBatch.length;
            exportBtnText.textContent = `ดาวน์โหลด PDF (${scanBatch.length} หน้า)`;

            if (scanBatch.length === 0) {
                document.getElementById('close-preview-btn').click();
                return;
            }

            scanBatch.forEach((imgData, index) => {
                const div = document.createElement('div');
                div.className = 'relative bg-white dark:bg-gray-800 p-2 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm flex items-center justify-center';
                div.innerHTML = `
                    <div class="absolute top-2 left-2 bg-gray-900/80 text-white text-xs px-2 py-1 rounded backdrop-blur-sm shadow z-10 font-bold">${index + 1}</div>
                    <button onclick="removeScanPage(${index})" class="absolute top-2 right-2 bg-red-500 hover:bg-red-600 text-white p-1.5 rounded-full shadow z-10 active:scale-95 transition-transform"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    <img src="${imgData}" class="w-full h-auto object-contain rounded">
                `;
                grid.appendChild(div);
            });
            lucide.createIcons({root: grid});
        }

        window.removeScanPage = (index) => {
            scanBatch.splice(index, 1);
            updateBatchUI();
            renderScanPreview();
        };

        document.getElementById('open-export-sheet-btn').addEventListener('click', () => {
            scanExportModal.classList.remove('hidden'); scanExportModal.classList.add('flex');
            setTimeout(() => { scanExportSheet.classList.remove('translate-y-full'); }, 10);
        });

        document.getElementById('close-export-btn').addEventListener('click', () => {
            scanExportSheet.classList.add('translate-y-full');
            setTimeout(() => { scanExportModal.classList.add('hidden'); scanExportModal.classList.remove('flex'); }, 300);
        });

        const paperSizeSelect = document.getElementById('paper-size-select');
        
        document.getElementById('scan-save-final-btn').addEventListener('click', () => {
            showLoading('กำลังสร้างไฟล์ PDF...');
            setTimeout(() => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: paperSizeSelect.value });
                    
                    scanBatch.forEach((imgData, index) => {
                        if (index > 0) doc.addPage();
                        const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
                        const props = doc.getImageProperties(imgData);
                        let fw = pw, fh = (props.height * pw) / props.width;
                        if (fh > ph) { fh = ph; fw = (props.width * ph) / props.height; }
                        doc.addImage(imgData, 'JPEG', (pw-fw)/2, (ph-fh)/2, fw, fh);
                    });

                    doc.save(`Scan_${new Date().toISOString().replace(/[:.]/g,'-')}.pdf`);
                    hideLoading(); showToast('บันทึกสำเร็จ!', 'success');
                    
                    scanBatch = []; updateBatchUI(); 
                    document.getElementById('close-export-btn').click();
                    scanPreviewView.classList.add('hidden');
                    setTimeout(() => backBtn.click(), 500); 
                } catch(e) { 
                    hideLoading(); showToast('ข้อผิดพลาดในการสร้าง PDF', 'error'); 
                }
            }, 100);
        });

        const mergeInput = document.getElementById('merge-file-input');
        const mergeList = document.getElementById('merge-file-list');
        const mergeCount = document.getElementById('merge-count');
        const mergeActionBtn = document.getElementById('action-merge-btn');

        function resetMergeWorkspace() {
            filesToMerge = []; mergeInput.value = ''; renderMergeList();
        }

        mergeInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files).filter(f => f.type === 'application/pdf');
            if (files.length === 0) return;
            filesToMerge = [...filesToMerge, ...files];
            renderMergeList(); e.target.value = '';
        });

        function renderMergeList() {
            mergeList.innerHTML = '';
            mergeCount.textContent = `${filesToMerge.length} ไฟล์`;
            mergeActionBtn.disabled = filesToMerge.length < 2;

            filesToMerge.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = 'bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-3 rounded-xl flex items-center justify-between shadow-sm cursor-grab active:cursor-grabbing group';
                li.dataset.index = index;
                li.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <i data-lucide="grip-vertical" class="text-gray-400 w-5 h-5 flex-shrink-0"></i>
                        <div class="bg-orange-100 dark:bg-orange-900/30 p-2 rounded-lg text-orange-600 dark:text-orange-400 flex-shrink-0">
                            <i data-lucide="file-text" class="w-5 h-5"></i>
                        </div>
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-200 truncate whitespace-nowrap overflow-hidden">${file.name}</span>
                    </div>
                    <button type="button" class="text-gray-400 hover:text-red-500 p-2 flex-shrink-0" onclick="removeMergeFile(${index})">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                `;
                mergeList.appendChild(li);
            });
            lucide.createIcons({ root: mergeList });

            if (mergeSortable) mergeSortable.destroy();
            mergeSortable = new Sortable(mergeList, {
                animation: 150, handle: '.cursor-grab',
                onEnd: () => {
                    const newOrderList = Array.from(mergeList.children);
                    filesToMerge = newOrderList.map(li => filesToMerge[parseInt(li.dataset.index)]);
                    renderMergeList(); 
                }
            });
        }

        window.removeMergeFile = (index) => { filesToMerge.splice(index, 1); renderMergeList(); };

        mergeActionBtn.addEventListener('click', async () => {
            if (filesToMerge.length < 2) return;
            showLoading('กำลังรวมไฟล์ PDF...');
            try {
                const mergedPdf = await PDFLib.PDFDocument.create();
                for (const file of filesToMerge) {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
                    const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    copiedPages.forEach((page) => mergedPdf.addPage(page));
                }
                const pdfBytes = await mergedPdf.save();
                triggerDownload(pdfBytes, `Merged_${new Date().getTime()}.pdf`);
                hideLoading(); showToast('รวมไฟล์สำเร็จ!', 'success'); resetMergeWorkspace();
            } catch (error) {
                hideLoading(); showToast('เกิดข้อผิดพลาดในการรวมไฟล์', 'error');
            }
        });

        const editorInput = document.getElementById('editor-file-input');
        const editorUploadSec = document.getElementById('editor-upload-section');
        const editorWorkspace = document.getElementById('editor-workspace');
        const editorThumbGrid = document.getElementById('pdf-thumbnails-grid');
        const editorInstruction = document.getElementById('editor-instruction').querySelector('span');
        const editorActionBtn = document.getElementById('editor-action-btn');
        const editorBtnText = document.getElementById('editor-btn-text');

        function resetEditorWorkspace(toolMode) {
            editorUploadSec.classList.remove('hidden');
            editorWorkspace.classList.add('hidden'); editorWorkspace.classList.remove('flex');
            editorInput.value = ''; editorPdfBytes = null; editorOriginalFile = null; editorTotalPages = 0; editorSelectedPages.clear();
            if (editorSortable) { editorSortable.destroy(); editorSortable = null; }

            let instr = "", btnTxt = "";
            if (toolMode === 'remove') { instr = "แตะหน้ากระดาษที่ต้องการ 'ลบ' (กรอบสีแดง)"; btnTxt = "ลบหน้าที่เลือก และบันทึก"; }
            else if (toolMode === 'extract') { instr = "แตะหน้ากระดาษที่ต้องการ 'แยกออกมา' (กรอบสีเขียว)"; btnTxt = "สร้าง PDF ใหม่จากหน้าที่เลือก"; }
            else if (toolMode === 'split') { instr = "ไฟล์จะถูกแยกเป็น PDF หน้าเดี่ยวๆ ทุกหน้า"; btnTxt = "แยกเป็นหน้าเดี่ยวๆ (ดาวน์โหลดทั้งหมด)"; }
            else if (toolMode === 'organize') { instr = "กดค้างที่หน้ากระดาษแล้วลากเพื่อ 'จัดเรียงใหม่'"; btnTxt = "บันทึกลำดับกระดาษใหม่"; }
            
            editorInstruction.textContent = instr; editorBtnText.textContent = btnTxt; editorActionBtn.disabled = true;
        }

        editorInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || file.type !== 'application/pdf') return;
            
            showLoading('กำลังอ่านไฟล์ PDF...');
            editorOriginalFile = file; editorSelectedPages.clear();

            try {
                editorPdfBytes = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: editorPdfBytes });
                const pdf = await loadingTask.promise;
                editorTotalPages = pdf.numPages;

                editorThumbGrid.innerHTML = ''; 
                if(currentTool === 'split' || currentTool === 'organize') editorActionBtn.disabled = false;
                else editorActionBtn.disabled = true;

                for (let i = 1; i <= editorTotalPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 0.5 }); 
                    
                    const container = document.createElement('div');
                    container.className = 'relative flex flex-col items-center bg-white dark:bg-gray-800 p-2 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm';
                    container.dataset.pageIndex = i - 1;

                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-page-thumbnail w-full h-auto border border-gray-200 rounded object-contain bg-white';
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    
                    const badge = document.createElement('div');
                    badge.className = 'absolute top-1 left-1 bg-gray-900/70 text-white text-[10px] px-1.5 py-0.5 rounded backdrop-blur-sm pointer-events-none';
                    badge.textContent = i;
                    
                    const checkIcon = document.createElement('div');
                    checkIcon.className = 'absolute inset-0 flex items-center justify-center opacity-0 transition-opacity pointer-events-none z-10';
                    checkIcon.innerHTML = `<div class="bg-white rounded-full shadow-lg p-1"><i data-lucide="${currentTool === 'remove' ? 'trash' : 'check'}" class="w-8 h-8 ${currentTool === 'remove' ? 'text-red-500' : 'text-green-500'}"></i></div>`;

                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    
                    container.appendChild(canvas); container.appendChild(badge); container.appendChild(checkIcon);

                    if (currentTool === 'remove' || currentTool === 'extract') {
                        container.addEventListener('click', () => togglePageSelection(container, canvas, checkIcon, i - 1));
                    }
                    if (currentTool === 'organize') canvas.classList.add('cursor-grab');

                    editorThumbGrid.appendChild(container);
                }
                
                lucide.createIcons({ root: editorThumbGrid });

                if (currentTool === 'organize') {
                    editorSortable = new Sortable(editorThumbGrid, { animation: 150, ghostClass: 'opacity-50' });
                }

                editorUploadSec.classList.add('hidden');
                editorWorkspace.classList.remove('hidden'); editorWorkspace.classList.add('flex');
                
                hideLoading();
            } catch (error) {
                hideLoading(); showToast('ไม่สามารถอ่านไฟล์ PDF นี้ได้', 'error');
            }
        });

        function togglePageSelection(container, canvas, icon, index) {
            if (editorSelectedPages.has(index)) {
                editorSelectedPages.delete(index);
                canvas.classList.remove(currentTool === 'remove' ? 'selected-remove' : 'selected-extract');
                icon.classList.remove('opacity-100');
            } else {
                editorSelectedPages.add(index);
                canvas.classList.add(currentTool === 'remove' ? 'selected-remove' : 'selected-extract');
                icon.classList.add('opacity-100');
            }
            editorActionBtn.disabled = editorSelectedPages.size === 0;
            
            if(currentTool === 'remove') editorBtnText.textContent = `ลบ ${editorSelectedPages.size} หน้า และบันทึก`;
            else if (currentTool === 'extract') editorBtnText.textContent = `สร้าง PDF ใหม่ (${editorSelectedPages.size} หน้า)`;
        }

        function triggerDownload(bytes, filename) {
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click();
            setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 0);
        }

        editorActionBtn.addEventListener('click', async () => {
            showLoading('กำลังประมวลผล PDF...');
            try {
                const pdfDoc = await PDFLib.PDFDocument.load(editorPdfBytes);
                let finalBytes = null;
                const baseName = editorOriginalFile.name.replace('.pdf', '');

                if (currentTool === 'remove') {
                    const indicesToRemove = Array.from(editorSelectedPages).sort((a, b) => b - a);
                    indicesToRemove.forEach(index => { pdfDoc.removePage(index); });
                    finalBytes = await pdfDoc.save();
                    triggerDownload(finalBytes, `${baseName}_Removed.pdf`);
                } 
                else if (currentTool === 'extract') {
                    const newPdf = await PDFLib.PDFDocument.create();
                    const indicesToKeep = Array.from(editorSelectedPages).sort((a, b) => a - b);
                    const copiedPages = await newPdf.copyPages(pdfDoc, indicesToKeep);
                    copiedPages.forEach(page => newPdf.addPage(page));
                    finalBytes = await newPdf.save();
                    triggerDownload(finalBytes, `${baseName}_Extracted.pdf`);
                } 
                else if (currentTool === 'organize') {
                    const newPdf = await PDFLib.PDFDocument.create();
                    const newOrderList = Array.from(editorThumbGrid.children);
                    const orderedIndices = newOrderList.map(container => parseInt(container.dataset.pageIndex));
                    const copiedPages = await newPdf.copyPages(pdfDoc, orderedIndices);
                    copiedPages.forEach(page => newPdf.addPage(page));
                    finalBytes = await newPdf.save();
                    triggerDownload(finalBytes, `${baseName}_Reorganized.pdf`);
                }
                else if (currentTool === 'split') {
                    hideLoading(); showToast('กำลังทยอยดาวน์โหลดทีละหน้า...', 'info');
                    for (let i = 0; i < editorTotalPages; i++) {
                        const newPdf = await PDFLib.PDFDocument.create();
                        const [copiedPage] = await newPdf.copyPages(pdfDoc, [i]);
                        newPdf.addPage(copiedPage);
                        const singleByte = await newPdf.save();
                        await new Promise(resolve => setTimeout(resolve, 300));
                        triggerDownload(singleByte, `${baseName}_Page_${i + 1}.pdf`);
                    }
                    showToast('ดาวน์โหลดเสร็จสิ้น!', 'success');
                    setTimeout(() => backBtn.click(), 1000); 
                    return; 
                }

                hideLoading(); showToast('ดำเนินการสำเร็จ!', 'success');
                setTimeout(() => backBtn.click(), 1500);

            } catch (error) {
                hideLoading(); showToast('เกิดข้อผิดพลาดระหว่างประมวลผล', 'error');
            }
        });
    </script>
</body>
</html>
