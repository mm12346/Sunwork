<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="theme-color" content="#5E64D1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SUNWORK">
    
    <title>SUNWORK - Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Kanit', sans-serif; }
        
        .manga-bg-dots {
            background-color: #f8f9fa;
            background-image: radial-gradient(#d1d5db 20%, transparent 20%);
            background-size: 16px 16px;
        }

        .manga-lines {
            background-image: repeating-linear-gradient(45deg, #000 0, #000 2px, transparent 2px, transparent 10px);
        }

        .manga-hover-dots {
            background-image: radial-gradient(#000 15%, transparent 15%);
            background-size: 10px 10px;
        }

        .manga-card {
            border: 4px solid #000;
            box-shadow: 8px 8px 0px 0px #000;
            transition: all 0.2s ease-in-out;
        }
        
        .manga-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0px 0px #000;
        }

        .manga-card:active {
            transform: translate(8px, 8px);
            box-shadow: 0px 0px 0px 0px #000;
        }

        .manga-input {
            border: 4px solid #000;
            box-shadow: 4px 4px 0px 0px #000;
            transition: all 0.2s;
        }
        
        .manga-input:focus {
            outline: none;
            box-shadow: 6px 6px 0px 0px #000;
            transform: translate(-2px, -2px);
        }

        .manga-btn {
            border: 4px solid #000;
            box-shadow: 4px 4px 0px 0px #000;
            transition: all 0.1s;
        }
        
        .manga-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px #000;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #000;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Scrollbar สำหรับ Modal */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-left: 2px solid #000; }
        ::-webkit-scrollbar-thumb { background: #000; }
    </style>
</head>
<body class="manga-bg-dots min-h-screen relative">

    <div id="login-view" class="absolute inset-0 flex items-center justify-center p-4 z-20 bg-white/80 backdrop-blur-sm">
        <div class="bg-white border-4 border-black p-8 max-w-md w-full relative">
            <div class="absolute -top-4 -left-4 w-8 h-8 bg-yellow-300 border-4 border-black rounded-full"></div>
            <div class="absolute -bottom-4 -right-4 w-12 h-12 bg-pink-400 border-4 border-black manga-lines"></div>
            
            <div class="text-center mb-8">
                <h1 class="text-4xl font-black uppercase tracking-wider">SUNWORK</h1>
                <p class="font-bold text-gray-600 mt-2">ลงชื่อเข้าใช้งานระบบ</p>
            </div>

            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block font-bold mb-2">ชื่อผู้ใช้งาน (Username)</label>
                    <input type="text" id="username" class="manga-input w-full p-3 font-bold text-lg" placeholder="กรอกชื่อผู้ใช้..." required>
                </div>
                <div>
                    <label class="block font-bold mb-2">รหัสผ่าน (Password)</label>
                    <input type="password" id="password" class="manga-input w-full p-3 font-bold text-lg" placeholder="กรอกรหัสผ่าน..." required>
                </div>
                
                <div id="login-error" class="hidden bg-red-100 border-4 border-red-500 p-3 text-red-700 font-bold text-center text-sm"></div>

                <button type="submit" id="login-btn" class="manga-btn w-full bg-cyan-300 py-3 text-xl font-black uppercase flex justify-center items-center gap-2">
                    <span id="btn-text">เข้าสู่ระบบ 🚀</span>
                    <span id="btn-loader" class="loader hidden"></span>
                </button>
                
                <div class="text-center text-sm font-bold text-gray-500 mt-4">
                    <p>ทดสอบระบบ: admin / 1234</p>
                </div>
            </form>
        </div>
    </div>

    <div id="main-menu-view" class="hidden w-full p-4 md:p-8 lg:p-12">
        
        <div class="flex justify-between items-center mb-8 bg-white border-4 border-black p-4 shadow-[4px_4px_0px_0px_#000]">
            <div class="font-bold flex items-center">
                <span>ยินดีต้อนรับ, <span id="display-user" class="text-blue-600 font-black text-lg ml-1">Guest</span></span>
                <span id="display-role" class="ml-2 text-xs bg-black text-white px-2 py-1 uppercase rounded-full">User</span>
            </div>
            <button onclick="logout()" class="manga-btn bg-red-400 px-4 py-2 font-black text-sm flex items-center gap-2">
                <i class="ph ph-sign-out"></i> ออกจากระบบ
            </button>
        </div>

        <div class="mb-10 relative inline-block">
            <div class="absolute inset-0 manga-lines border-4 border-black translate-x-3 translate-y-3"></div>
            <div class="relative bg-white border-4 border-black px-6 py-4 z-10">
                <h1 class="text-3xl md:text-5xl font-black text-black tracking-wide uppercase">⚡ My Applications</h1>
                <p class="text-black font-bold mt-2 text-lg">เลือกระบบที่คุณต้องการใช้งาน</p>
            </div>
        </div>

        <div id="apps-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 lg:gap-8">
            <!-- ปุ่มแอปต่างๆ จะมาโผล่ตรงนี้ -->
            
            <button id="settings-btn" class="manga-card block w-full bg-white group relative overflow-hidden text-left cursor-pointer">
                <div class="flex items-center p-5">
                    <div class="w-14 h-14 flex-shrink-0 flex items-center justify-center border-4 border-black bg-gray-300 shadow-[4px_4px_0px_0px_#000] group-hover:scale-110 transition-transform z-10">
                        <i class="ph ph-gear text-3xl text-black"></i>
                    </div>
                    <div class="ml-5 z-10">
                        <h2 class="text-xl font-black text-black">ตั้งค่าระบบ</h2>
                        <p class="text-sm font-bold text-gray-700 mt-1">จัดการสิทธิ์และการใช้งาน (Admin)</p>
                    </div>
                </div>
                <div class="absolute inset-0 bg-gray-300 manga-hover-dots opacity-0 group-hover:opacity-20 transition-opacity"></div>
            </button>
        </div>
    </div>

    <div id="custom-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm">
        <div class="bg-white border-4 border-black shadow-[12px_12px_0px_0px_#000] max-w-2xl w-full max-h-[90vh] flex flex-col relative">
            
            <div id="modal-header" class="bg-yellow-300 border-b-4 border-black p-4 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-3">
                    <button id="modal-back-btn" onclick="renderSettingsMenu()" class="hidden w-8 h-8 flex justify-center items-center bg-white border-4 border-black shadow-[2px_2px_0px_0px_#000] active:translate-y-0.5 active:shadow-none transition-all">
                        <i class="ph ph-caret-left font-black"></i>
                    </button>
                    <h3 id="modal-title" class="font-black text-xl uppercase">แจ้งเตือน</h3>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 flex justify-center items-center bg-white border-4 border-black shadow-[2px_2px_0px_0px_#000] active:translate-y-0.5 active:shadow-none transition-all">
                    <i class="ph ph-x font-black"></i>
                </button>
            </div>
            
            <div id="modal-body" class="p-6 font-bold text-base overflow-y-auto grow">
                <!-- เนื้อหาจะเปลี่ยนไปตามเมนู -->
            </div>
        </div>
    </div>

    <script>
        /**
         * นำ URL ของ Apps Script ที่ได้จากการ Deploy มาใส่ที่ตัวแปรด้านล่าง
         */
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZfk-K3CMlRU0TDcZsob9t7neFOeOikzZxXz6Jnk-6RvvDdcAk5h2kD2evJTkX58m_7w/exec'; // เปลี่ยนตรงนี้
        
        let currentUser = null;

        const COLOR_OPTIONS = [
            { value: 'bg-red-400', label: '🔴 แดง (Red)' },
            { value: 'bg-orange-400', label: '🟠 ส้ม (Orange)' },
            { value: 'bg-yellow-300', label: '🟡 เหลือง (Yellow)' },
            { value: 'bg-green-400', label: '🟢 เขียว (Green)' },
            { value: 'bg-emerald-400', label: '🟢 เขียวมรกต (Emerald)' },
            { value: 'bg-cyan-300', label: '🧊 ฟ้า (Cyan)' },
            { value: 'bg-blue-400', label: '🔵 น้ำเงิน (Blue)' },
            { value: 'bg-indigo-400', label: '🫐 คราม (Indigo)' },
            { value: 'bg-purple-400', label: '🟣 ม่วง (Purple)' },
            { value: 'bg-pink-400', label: '🌸 ชมพู (Pink)' },
            { value: 'bg-gray-300', label: '⚪ เทา (Gray)' },
            { value: 'bg-lime-400', label: '🍋 มะนาว (Lime)' }
        ];

        const loginForm = document.getElementById('login-form');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            toggleLoginLoading(true);

            try {
                if (SCRIPT_URL && !SCRIPT_URL.includes('YOUR_GOOGLE_APPS_SCRIPT')) {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'login', username: user, password: pass }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        processLoginSuccess(data.username, data.role, data.allowedApps, data.buttons);
                    } else {
                        throw new Error(data.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                    }
                } else {
                    // MOCK LOGIN
                    await new Promise(r => setTimeout(r, 1000)); 
                    const mockButtons = [
                        { name: 'ทะเบียนพนักงาน', url: 'hr.html', appId: '1', icon: 'ph-users', color: 'bg-green-400', desc: 'ข้อมูลบุคลากรและทีมงาน' },
                        { name: 'ตรวจเครื่องมือ', url: '#', appId: '2', icon: 'ph-wrench', color: 'bg-yellow-300', desc: 'ระบบตรวจสอบเครื่องมือไฟฟ้า' }
                    ];

                    if (user === 'admin' && pass === '1234') {
                        processLoginSuccess('Admin Mock', 'admin', 'ALL', mockButtons);
                    } else {
                        throw new Error('กรุณาใส่ SCRIPT_URL ก่อน (ตอนนี้ใช้ระบบ Mock - รหัส: admin/1234)');
                    }
                }
            } catch (error) {
                showLoginError(error.message);
            } finally {
                toggleLoginLoading(false);
            }
        });

        function toggleLoginLoading(isLoading) {
            document.getElementById('login-error').classList.add('hidden');
            document.getElementById('btn-text').classList.toggle('hidden', isLoading);
            document.getElementById('btn-loader').classList.toggle('hidden', !isLoading);
            document.getElementById('login-btn').disabled = isLoading;
        }

        function showLoginError(msg) {
            const errEl = document.getElementById('login-error');
            errEl.classList.remove('hidden');
            errEl.textContent = msg;
        }

        function processLoginSuccess(username, role, allowedApps, buttonsData) {
            currentUser = { username, role };
            
            // บันทึก Session ข้อมูลผู้ใช้และปุ่มลงใน LocalStorage
            localStorage.setItem('sunwork_user_session', JSON.stringify({
                username: username,
                role: role,
                allowedApps: allowedApps,
                buttonsData: buttonsData
            }));
            
            document.getElementById('display-user').textContent = currentUser.username;
            const roleEl = document.getElementById('display-role');
            roleEl.textContent = currentUser.role;
            roleEl.className = role === 'admin' 
                ? "ml-2 text-xs bg-red-500 text-white px-2 py-1 uppercase rounded-full font-bold"
                : "ml-2 text-xs bg-black text-white px-2 py-1 uppercase rounded-full font-bold";

            // ลบปุ่มเก่าออกก่อนวาดใหม่
            document.querySelectorAll('.dynamic-app-btn').forEach(btn => btn.remove());
            const appsGrid = document.getElementById('apps-grid');
            const settingsBtn = document.getElementById('settings-btn');

            let allowedArray = allowedApps === 'ALL' ? [] : String(allowedApps).split(',').map(id => id.trim());

            if (buttonsData && buttonsData.length > 0) {
                buttonsData.forEach(btn => {
                    if (allowedApps === 'ALL' || allowedArray.includes(btn.appId)) {
                        const btnEl = document.createElement('a');
                        btnEl.href = btn.url || '#';
                        btnEl.className = 'dynamic-app-btn manga-card block bg-white group relative overflow-hidden';
                        btnEl.innerHTML = `
                            <div class="flex items-center p-5">
                                <div class="w-14 h-14 flex-shrink-0 flex items-center justify-center border-4 border-black ${btn.color} shadow-[4px_4px_0px_0px_#000] group-hover:scale-110 transition-transform z-10">
                                    <i class="ph ${btn.icon} text-3xl text-black"></i>
                                </div>
                                <div class="ml-5 z-10">
                                    <h2 class="text-xl font-black text-black">${btn.name}</h2>
                                    <p class="text-sm font-bold text-gray-700 mt-1">${btn.desc}</p>
                                </div>
                            </div>
                            <div class="absolute inset-0 ${btn.color} manga-hover-dots opacity-0 group-hover:opacity-20 transition-opacity"></div>
                        `;
                        appsGrid.insertBefore(btnEl, settingsBtn);
                    }
                });
            }

            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('main-menu-view').classList.remove('hidden');
            loginForm.reset();
        }

        function logout() {
            currentUser = null;
            // ลบ Session ออกเมื่อออกจากระบบ
            localStorage.removeItem('sunwork_user_session');
            
            document.getElementById('main-menu-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function setModalContent(title, html, colorClass = 'bg-gray-300', showBack = true) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal-header').className = `${colorClass} border-b-4 border-black p-4 flex justify-between items-center shrink-0`;
            document.getElementById('modal-back-btn').classList.toggle('hidden', !showBack);
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        async function callApi(action, dataObj = {}) {
            if (!SCRIPT_URL || SCRIPT_URL.includes('YOUR_GOOGLE_APPS_SCRIPT')) {
                alert("กรุณาเชื่อมต่อ Google Apps Script ก่อน (ระบุ URL ในโค้ด)");
                return null;
            }
            
            document.getElementById('modal-body').innerHTML = `
                <div class="flex flex-col items-center justify-center py-10">
                    <div class="loader mb-4"></div>
                    <p class="text-xl">กำลังดึงข้อมูล...</p>
                </div>`;
                
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: action, ...dataObj }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                return await res.json();
            } catch (e) {
                alert('เกิดข้อผิดพลาด: ' + e.message);
                return null;
            }
        }

        document.getElementById('settings-btn').addEventListener('click', () => {
            if (!currentUser) return;
            if (currentUser.role !== 'admin') {
                setModalContent('Access Denied ❌', '<p class="text-red-600 text-center py-4">คุณไม่มีสิทธิ์เข้าถึงเมนูตั้งค่าระบบ <br>เฉพาะระดับ "Admin" เท่านั้น</p>', 'bg-red-400', false);
                return;
            }
            renderSettingsMenu();
        });

        function renderSettingsMenu() {
            const html = `
                <div class="space-y-4">
                    <p class="mb-2 text-gray-700">เลือกระบบที่ต้องการจัดการ:</p>
                    <button onclick="fetchUsers()" class="manga-btn w-full bg-cyan-300 p-4 text-left flex items-center justify-between text-xl">
                        <span>👥 จัดการบัญชีผู้ใช้ (Users)</span>
                        <i class="ph ph-users-three"></i>
                    </button>
                    <button onclick="fetchButtons()" class="manga-btn w-full bg-purple-300 p-4 text-left flex items-center justify-between text-xl">
                        <span>📱 จัดการปุ่ม (Buttons)</span>
                        <i class="ph ph-app-window"></i>
                    </button>
                </div>
            `;
            setModalContent('⚙️ ตั้งค่าระบบ', html, 'bg-gray-300', false);
        }

        async function fetchUsers() {
            setModalContent('👥 จัดการบัญชีผู้ใช้', '', 'bg-cyan-300', true);
            const res = await callApi('getUsers');
            if (!res) { renderSettingsMenu(); return; }

            let listHtml = `<button onclick="editUser(null)" class="manga-btn mb-6 bg-green-400 px-4 py-2 text-sm flex items-center gap-2"><i class="ph ph-plus-circle text-lg"></i> เพิ่มผู้ใช้ใหม่</button>`;
            
            res.data.forEach(row => {
                listHtml += `
                <div class="border-4 border-black p-4 mb-4 flex justify-between items-center bg-gray-50">
                    <div>
                        <div class="text-lg font-black">${row[0]} <span class="text-sm bg-black text-white px-2 py-0.5 rounded-full ml-2">${row[3]}</span></div>
                        <div class="text-sm font-normal text-gray-600">ชื่อ: ${row[2]} | สิทธิ์ปุ่ม: ${row[4]}</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editUser(['${row[0]}','${row[1]}','${row[2]}','${row[3]}','${row[4]}'])" class="w-10 h-10 bg-yellow-300 border-2 border-black flex justify-center items-center active:translate-y-1"><i class="ph ph-pencil-simple text-xl"></i></button>
                        <button onclick="deleteUser('${row[0]}')" class="w-10 h-10 bg-red-400 border-2 border-black flex justify-center items-center active:translate-y-1"><i class="ph ph-trash text-xl"></i></button>
                    </div>
                </div>`;
            });
            document.getElementById('modal-body').innerHTML = listHtml;
        }

        function editUser(userData) {
            const isEdit = !!userData;
            const u = isEdit ? userData : ['', '', '', 'user', ''];
            
            const html = `
                <form id="user-form" class="space-y-4">
                    <div><label class="block mb-1">Username (Key)</label><input type="text" id="u-user" class="manga-input w-full p-2 bg-gray-100" value="${u[0]}" ${isEdit ? 'readonly' : 'required'}></div>
                    <div><label class="block mb-1">Password</label><input type="text" id="u-pass" class="manga-input w-full p-2" value="${u[1]}" required></div>
                    <div><label class="block mb-1">ชื่อแสดงผล (Display)</label><input type="text" id="u-name" class="manga-input w-full p-2" value="${u[2]}" required></div>
                    <div>
                        <label class="block mb-1">ระดับสิทธิ์ (Role)</label>
                        <select id="u-role" class="manga-input w-full p-2">
                            <option value="user" ${u[3] === 'user' ? 'selected' : ''}>User (ทั่วไป)</option>
                            <option value="admin" ${u[3] === 'admin' ? 'selected' : ''}>Admin (ผู้ดูแล)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-1">App IDs ที่อนุญาต (คั่นด้วยลูกน้ำ หรือใส่ ALL)</label>
                        <input type="text" id="u-apps" class="manga-input w-full p-2" value="${u[4]}" placeholder="เช่น 1,2,5 หรือ ALL" required>
                    </div>
                    <div class="flex gap-4 pt-4">
                        <button type="button" onclick="fetchUsers()" class="manga-btn flex-1 bg-gray-300 p-2">ยกเลิก</button>
                        <button type="button" onclick="saveUser()" class="manga-btn flex-1 bg-green-400 p-2">💾 บันทึก</button>
                    </div>
                </form>
            `;
            setModalContent(isEdit ? '✏️ แก้ไขผู้ใช้' : '✨ เพิ่มผู้ใช้ใหม่', html, 'bg-cyan-300', true);
        }

        async function saveUser() {
            const data = {
                username: document.getElementById('u-user').value,
                password: document.getElementById('u-pass').value,
                displayName: document.getElementById('u-name').value,
                role: document.getElementById('u-role').value,
                allowedApps: document.getElementById('u-apps').value
            };
            if(!data.username) return alert('กรุณากรอก Username');
            
            const res = await callApi('saveUser', data);
            if(res && res.status === 'success') fetchUsers();
        }

        async function deleteUser(username) {
            if (username === 'admin') return alert('ไม่สามารถลบ admin หลักได้!');
            if (confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบผู้ใช้: ${username} ?`)) {
                const res = await callApi('deleteUser', { username });
                if(res && res.status === 'success') fetchUsers();
            }
        }

        async function fetchButtons() {
            setModalContent('📱 จัดการปุ่มแอป', '', 'bg-purple-300', true);
            const res = await callApi('getButtons');
            if (!res) { renderSettingsMenu(); return; }

            let listHtml = `<button onclick="editButton(null)" class="manga-btn mb-6 bg-green-400 px-4 py-2 text-sm flex items-center gap-2"><i class="ph ph-plus-circle text-lg"></i> เพิ่มปุ่มใหม่</button>`;
            
            res.data.forEach(row => {
                if(!row[0]) return; // ข้ามแถวว่าง
                listHtml += `
                <div class="border-4 border-black p-3 mb-4 flex justify-between items-center bg-gray-50">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 flex justify-center items-center border-2 border-black ${row[4]} shrink-0"><i class="ph ${row[3]} text-2xl"></i></div>
                        <div>
                            <div class="text-lg font-black leading-tight">${row[0]} <span class="text-xs bg-black text-white px-1 ml-1">ID:${row[2]}</span></div>
                            <div class="text-xs font-normal text-gray-500 truncate max-w-[150px] md:max-w-[300px]">${row[1]}</div>
                        </div>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <button onclick="editButton(['${row[0]}','${row[1]}','${row[2]}','${row[3]}','${row[4]}','${row[5]}'])" class="w-10 h-10 bg-yellow-300 border-2 border-black flex justify-center items-center active:translate-y-1"><i class="ph ph-pencil-simple text-xl"></i></button>
                        <button onclick="deleteButton('${row[2]}')" class="w-10 h-10 bg-red-400 border-2 border-black flex justify-center items-center active:translate-y-1"><i class="ph ph-trash text-xl"></i></button>
                    </div>
                </div>`;
            });
            document.getElementById('modal-body').innerHTML = listHtml;
        }

        function editButton(btnData) {
            const isEdit = !!btnData;
            const b = isEdit ? btnData : ['', '#', '', 'ph-app-window', 'bg-gray-300', '']; 
            
            let colorOptionsHtml = COLOR_OPTIONS.map(c => 
                `<option value="${c.value}" class="${c.value}" ${b[4] === c.value ? 'selected' : ''}>${c.label}</option>`
            ).join('');

            const html = `
                <form id="btn-form" class="space-y-4">
                    <div>
                        <label class="block mb-1">รหัส App ID (ห้ามซ้ำ)</label>
                        <input type="text" id="b-id" class="manga-input w-full p-2 bg-gray-100" value="${b[2]}" placeholder="เช่น 12" ${isEdit ? 'readonly' : 'required'}>
                    </div>
                    <div><label class="block mb-1">ชื่อปุ่ม (ชื่อระบบ)</label><input type="text" id="b-name" class="manga-input w-full p-2" value="${b[0]}" required></div>
                    <div><label class="block mb-1">ลิงก์ URL</label><input type="text" id="b-url" class="manga-input w-full p-2" value="${b[1]}" required></div>
                    <div>
                        <label class="block mb-1">รหัสไอคอน <a href="https://phosphoricons.com/" target="_blank" class="text-blue-600 underline text-sm">(ค้นหาไอคอน)</a></label>
                        <input type="text" id="b-icon" class="manga-input w-full p-2" value="${b[3]}" placeholder="เช่น ph-users">
                    </div>
                    <div>
                        <label class="block mb-1">สีพื้นหลังปุ่ม (Dropdown)</label>
                        <select id="b-color" class="manga-input w-full p-2 font-bold cursor-pointer">
                            ${colorOptionsHtml}
                        </select>
                    </div>
                    <div><label class="block mb-1">คำอธิบายสั้นๆ</label><input type="text" id="b-desc" class="manga-input w-full p-2" value="${b[5]}"></div>
                    
                    <div class="flex gap-4 pt-4">
                        <button type="button" onclick="fetchButtons()" class="manga-btn flex-1 bg-gray-300 p-2">ยกเลิก</button>
                        <button type="button" onclick="saveButton()" class="manga-btn flex-1 bg-green-400 p-2">💾 บันทึก</button>
                    </div>
                </form>
            `;
            setModalContent(isEdit ? '✏️ แก้ไขปุ่ม' : '✨ เพิ่มปุ่มใหม่', html, 'bg-purple-300', true);
        }

        async function saveButton() {
            const data = {
                appId: document.getElementById('b-id').value,
                name: document.getElementById('b-name').value,
                url: document.getElementById('b-url').value,
                icon: document.getElementById('b-icon').value,
                color: document.getElementById('b-color').value,
                desc: document.getElementById('b-desc').value
            };
            if(!data.appId || !data.name) return alert('กรุณากรอก App ID และ ชื่อปุ่ม');
            
            const res = await callApi('saveButton', data);
            if(res && res.status === 'success') fetchButtons();
        }

        async function deleteButton(appId) {
            if (confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบปุ่ม (App ID: ${appId}) ?`)) {
                const res = await callApi('deleteButton', { appId });
                if(res && res.status === 'success') fetchButtons();
            }
        }

        // ตรวจสอบสถานะการล็อกอินทันทีที่โหลดหน้าเว็บ (Auto-login)
        const sessionData = localStorage.getItem('sunwork_user_session');
        if (sessionData) {
            try {
                const data = JSON.parse(sessionData);
                if (data && data.username) {
                    // หากพบ Session ให้ส่งข้อมูลไปวาดปุ่มและซ่อนหน้า Login ทันที
                    processLoginSuccess(data.username, data.role, data.allowedApps, data.buttonsData);
                }
            } catch (e) {
                console.error("Session data is invalid or expired.");
                localStorage.removeItem('sunwork_user_session');
            }
        }

    </script>
</body>
</html>
